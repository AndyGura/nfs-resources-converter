/// McLaren F1

'-----------------------------------------------------------------
' 		VEHICLE EFFECTS DEFINITIONS
'-----------------------------------------------------------------

[effects]
specular_hotspot_exponent=55.0
fresnel_scaler=3.0


'-----------------------------------------------------------------
' 		VEHICLE SPLAT SHADOW DEFINITIONS
'-----------------------------------------------------------------

[splatshadow]
scale=1.1

'-----------------------------------------------------------------
' 		VEHICLE WHEEL RENDER OFFFSET DEFINITIONS
'-----------------------------------------------------------------

[wheel_front]
renderoffset=-0.02

[wheel_rear]
renderoffset=0.022


' 	RED/GREEN/BLUE
' 		0=LOWEST
' 		255=HIGHEST
'
 
' 	SPECULAR EXPONENTS
'		1.0=LOWEST DROP OFF
'		90.0=HIGH DROP OFF
'
[vehicletype]
type=primary

[skin00]
//red
color_id=red
specular_red=217
specular_green=80
specular_blue=80
specular_paint_exponent=5.0
specular_glass_exponent=40.0
specular_rubber_exponent=60.0
specular_sun_intensity=0
addons_enable=0

' front end paint swatch
[paintcolor0]
paintname=kTxtRed
painta=255
paintr=200
paintg=35
paintb=41
m_price=0


[skin01]
//black
color_id=black
specular_red=30
specular_green=30
specular_blue=30
specular_paint_exponent=15.0
specular_glass_exponent=40.0
specular_rubber_exponent=60.0
specular_sun_intensity=0
addons_enable=0

' front end paint swatch
[paintcolor1]
paintname=kTxtBlack
painta=255
paintr=4
paintg=4
paintb=4
m_price=0

[skin02]
//silvermetallic
color_id=silver
specular_red=204
specular_green=204
specular_blue=204
specular_paint_exponent=30.0
specular_glass_exponent=40.0
specular_rubber_exponent=60.0
specular_sun_intensity=0

' front end paint swatch
[paintcolor2]
paintname=kTxtSilver
painta=255
paintr=202
paintg=212
paintb=213
m_price=0

[skinhp]
color_id=purple
specular_red=0
specular_green=0
specular_blue=160
specular_paint_exponent=5.0
specular_glass_exponent=60.0
specular_rubber_exponent=60.0
specular_sun_intensity=20




'-----------------------------------------------------------------
' 		VEHICLE LIGHT DEFINITIONS
'-----------------------------------------------------------------

[coplights]
glow_num=0

[brakelights]
glow_num=2
attach_bone1=LIGHT_TAIL_LEFT1
attach_glow1=3
attach_bone2=LIGHT_TAIL_RIGHT1
attach_glow2=3


[headlights]
