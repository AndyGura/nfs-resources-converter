@if (resourceId) {
  <mat-checkbox
    [checked]="isPresent"
    [disabled]="!!disabled"
    [matTooltip]="
      (resourceDescription ? resourceDescription + ' ' : '') +
      'Normally present when: ' +
      (resourceSchema.criteria || '')
    "
    matTooltipPosition="above"
    (change)="setPresent($event.checked)">
    @if (!hideName && resourceName) {
      {{ resourceName }}
    } @else {
      Present
    }
  </mat-checkbox>
  @if (isPresent) {
    <app-editor
      [resourceOrError]="{
        id: resourceId,
        name: resourceName || '',
        schema: resourceSchema.child_schema,
        data: resourceData,
      }"
      [hideName]="true"
      [hideBlockActions]="hideBlockActions"
      [disabled]="disabled"></app-editor>
  }
}
