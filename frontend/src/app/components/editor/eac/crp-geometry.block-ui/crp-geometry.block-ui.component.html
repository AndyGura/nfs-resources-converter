@if (isTrack$ | async) {
  <app-track-map-block-ui
    [resourceId]="resourceId"
    [resourceName]="resourceName"
    [resourceSchema]="resourceSchema"
    [resourceData]="resourceData"
    [resourceDescription]="resourceDescription"
    [hideName]="hideName"
    [hideBlockActions]="hideBlockActions"
    [disabled]="disabled"></app-track-map-block-ui>
} @else {
  <app-obj-viewer
    [paths]="previewPaths$ | async"
    [viewFilters]="previewViewFilters"
    [visibilityGroupFunction]="previewObjectGroupFunc"
    [animationFrameFunction]="previewAnimationFrameFunc"></app-obj-viewer>
  <app-compound-block-ui
    [resourceId]="resourceId"
    [resourceName]="resourceName"
    [resourceSchema]="resourceSchema"
    [resourceData]="resourceData"
    [resourceDescription]="resourceDescription"
    [hideName]="hideName"
    [hideBlockActions]="hideBlockActions"
    [disabled]="disabled"></app-compound-block-ui>
}
