name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    if: "contains(github.event.head_commit.message, '[release]')"
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get current version
        id: get_version
        run: |
          VERSION=$(python3 -c "from version import __version__; print(__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.get_version.outputs.version }}"
          git push origin "v${{ steps.get_version.outputs.version }}"

  build:
    needs: release
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: tailslab-linux-${{ needs.release.outputs.version }}
          - os: windows-latest
            artifact_name: tailslab-windows-${{ needs.release.outputs.version }}.exe
          - os: macos-latest
            artifact_name: tailslab-macos-${{ needs.release.outputs.version }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Generate build configs
        run: python generate_build_configs.py

      - name: Verify committed build configs are up to date
        if: matrix.os == 'ubuntu-22.04'
        run: git diff --exit-code tailslab-mime.xml tailslab.desktop windows-installer.filetypes.iss

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          # pyinstaller tailslab.spec
          # Create .deb package using fpm
          # sudo apt-get update && sudo apt-get install -y ruby ruby-dev rubygems build-essential
          # sudo gem install --no-document fpm
          # mkdir -p package/usr/lib/tailslab
          # mkdir -p package/usr/bin
          # mkdir -p package/usr/share/applications
          # mkdir -p package/usr/share/mime/packages
          # mkdir -p package/usr/share/icons/hicolor/256x256/apps
          # cp -r dist/tailslab-${{ needs.release.outputs.version }}/* package/usr/lib/tailslab/
          # ln -s /usr/lib/tailslab/tailslab-${{ needs.release.outputs.version }} package/usr/bin/tailslab
          # cp tailslab.desktop package/usr/share/applications/
          # cp tailslab-mime.xml package/usr/share/mime/packages/
          # cp icons/tailslab-256.png package/usr/share/icons/hicolor/256x256/apps/tailslab.png
          # fpm -s dir -t deb -n tailslab -v ${{ needs.release.outputs.version }} \
          #   --description "TailsLab (formerly NFS Resources Converter)" \
          #   -p dist/tailslab-linux.deb \
          #   package/=/

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          pyinstaller tailslab.spec
          Invoke-WebRequest -Uri https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile MicrosoftEdgeWebview2Setup.exe
          iscc windows-installer.iss /DAppVersion=${{ needs.release.outputs.version }}

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller tailslab.spec
          # This creates "TailsLab.app" in dist/
          # Keep only the .app in a clean staging dir so the DMG doesn't include the raw COLLECT folder
          mkdir -p dmg-staging
          cp -R "dist/TailsLab.app" dmg-staging/
          # Create DMG
          brew install create-dmg
          create-dmg \
            --volname "TailsLab" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "TailsLab.app" 200 190 \
            --hide-extension "TailsLab.app" \
            --app-drop-link 600 185 \
            "dist/tailslab-macos-${{ needs.release.outputs.version }}.dmg" \
            "dmg-staging/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/tailslab-windows-setup-*.exe

  publish:
    needs: [release, build]
    runs-on: ubuntu-22.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          name: v${{ needs.release.outputs.version }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump-version:
    needs: publish
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          OLD=$(python3 -c "from version import __version__; print(__version__)")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i "s/__version__ = '.*'/__version__ = '$NEW'/" version.py
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.py
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git pull --rebase origin main
          git push
